name: Unit Test

# Run unit tests on every push or pull request, to main or develop
on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

# Checkout the code, and run mxcl's xcodebuild action to run the unit tests
jobs:
  build:
    runs-on: macOS-latest
    strategy:
      matrix:
        platform:
          - iOS
    steps:
      - uses: actions/checkout@5a4ac9002d0be2fb38bd78e4b4dbde5606d7042f # v2.3.4
      - uses: mxcl/xcodebuild@50de62057fb935d18daedb23fb07ca4e62e4ca40 # v1.11.0
        with:
          platform: ${{ matrix.platform }}
          action: test
          code-coverage: true
